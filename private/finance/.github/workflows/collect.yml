name: collect
on:
  schedule:
    - cron: "0 22 * * *"   # 매일 07:00 KST (미국장 마감 이후)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests cryptography
      - run: python collect.py
        env:
          TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
      - name: commit
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/history.enc
          git diff --cached --quiet || (git commit -m "snapshot $(date -u +%F)" && git push)
